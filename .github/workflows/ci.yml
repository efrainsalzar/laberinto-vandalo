# Integración continua: en cada push y pull request verifica que todo compile y que los tests pasen.
# Para builds de todas las plataformas (releases) usar make_build.yml desde la pestaña Actions.

name: CI
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  tests:
    name: Tests unitarios (doctest)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar SCons
        run: python -m pip install scons

      - name: Ejecutar tests
        run: scons tests=yes

  build:
    name: Build ${{ matrix.target.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: { platform: linux, arch: x86_64, os: ubuntu-22.04 }
          - target: { platform: windows, arch: x86_64, os: windows-latest }

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_template_debug

      - name: Compilar extensión
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: scons target=template_debug platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_template_debug
